[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-of-living"
version = "0.1.0"
description = "Local-first household cost-of-living transaction analysis"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2"]

[project.scripts]
cost-of-living = "cost_of_living.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
